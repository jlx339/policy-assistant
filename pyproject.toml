[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-policy-assistant"
version = "0.1.0"
description = "Cited RAG over a bounded public enterprise handbook corpus"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "requests>=2.32,<3", "streamlit>=1.39,<2",
  "langchain-core>=0.3,<2", "langchain-openai>=0.2,<2", "langgraph>=0.2,<2",
  "sentence-transformers>=3,<6", "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
